# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory containing .bb and .bbappend files, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "compulab-connectivity"
BBFILE_PATTERN_compulab-connectivity := "^${LAYERDIR}/"
BBFILE_PRIORITY_compulab-connectivity = "9"

LAYERSERIES_COMPAT_compulab-connectivity = "scarthgap"
